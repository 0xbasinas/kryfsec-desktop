appId: com.kryfsec.desktop
productName: kryfsec
copyright: Copyright © 2026 0xbasinas
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: kryfsec
  artifactName: ${productName}-Setup-${version}-x64.${ext}
linux:
  target: [AppImage]
  category: Education
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target: [dmg]
